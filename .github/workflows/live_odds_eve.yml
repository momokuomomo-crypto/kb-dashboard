name: Live Odds (前日20時)

# 金・土・日の20時（JST）に、翌日の全レースの単勝・複勝オッズ（前日発売）を1回記録する
# （picks/live_odds.py --eve）。保存先は非公開の kb-project の odds-live ブランチ（ARCHIVE_TOKEN）。
# 翌日に開催がなければすぐ終わる。公開リポジトリなのでActionsは無料。

on:
  schedule:
    - cron: "3 11 * * 5,6,0"  # 金・土・日 20:03 JST（毎時0分は混んで遅れやすい）
    - cron: "33 11 * * 5,6,0" # 20:33 JST（遅れ・取りこぼし対策。記録済みのレースは取らない）
    - cron: "13 12 * * 5,6,0" # 21:13 JST
  workflow_dispatch:
    inputs:
      date:
        description: "対象日（YYYYMMDD、省略時は明日 JST）"
        required: false

concurrency:
  group: live-odds
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 requests
      - name: Checkout private odds-live (kb-project)
        uses: actions/checkout@v4
        with:
          repository: momokuomomo-crypto/kb-project
          ref: odds-live
          path: odds
          token: ${{ secrets.ARCHIVE_TOKEN }}
          fetch-depth: 1
      - name: Record
        working-directory: picks
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          args="--out $GITHUB_WORKSPACE/odds --eve --git-push"
          if [ -n "${{ github.event.inputs.date }}" ]; then args="$args --date ${{ github.event.inputs.date }}"; fi
          python -m live_odds $args
