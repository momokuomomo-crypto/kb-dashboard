name: Weekend Picks (期待値派×騎手)

# 週末の全レースから「期待値派×指定騎手」の複勝の買い目を出し、
# picks.html / picks.json としてこのリポジトリ（GitHub Pages）に置く（picks/weekend.py）。
# 公開リポジトリなのでActionsは無料。jra-archiveブランチの全レースで学習する。
#   金・土 20:00 JST：翌日分（前日発売のオッズ）
#   土・日 9:00 / 12:00 JST：当日分を最新オッズで更新

on:
  schedule:
    - cron: "0 11 * * 5,6"  # 金・土 20:00 JST
    - cron: "0 0,3 * * 6,0" # 土・日 9:00 / 12:00 JST
  workflow_dispatch:
    inputs:
      dates:
        description: "対象日（YYYYMMDD,カンマ区切り。省略時は今日と明日）"
        required: false

concurrency:
  group: weekend-picks
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  picks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 requests
      - name: Fetch jra-archive
        run: |
          git fetch --depth 1 origin jra-archive
          git worktree add archive FETCH_HEAD
      - name: Tests
        working-directory: picks
        run: python -m unittest discover -s tests -q
      - name: Picks
        working-directory: picks
        run: |
          args="--archive $GITHUB_WORKSPACE/archive --out $GITHUB_WORKSPACE"
          if [ -n "${{ github.event.inputs.dates }}" ]; then args="$args --dates ${{ github.event.inputs.dates }}"; fi
          python -m weekend $args
      - name: Push
        run: |
          git worktree remove --force archive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add picks.html picks.json
          git diff --cached --quiet && { echo "変更なし"; exit 0; }
          git commit -m "週末の買い目を更新"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 5; done
          exit 1
