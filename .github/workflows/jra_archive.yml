name: JRA Archive (all races)

# JRA全レース（重賞・非重賞・新馬戦）の結果・払戻金・確定オッズ・血統を
# 非公開の kb-project の jra-archive ブランチへ保存する（kb-project 06_08）。
# 実行だけ公開リポジトリで行う（Actionsが無料）。データはこのリポジトリに置かない。
# シークレット ARCHIVE_TOKEN = kb-project だけに Contents 読み書き権限を持つトークン。
# ログには件数とレースIDだけを出す。JRAへは1秒1リクエストで取得する。
# 開催日（土・日・月）の夜21時台に、その日までの直近8日分＋グレード補完＋新しい出走馬の血統（最大90分）。
# 火曜朝にも予備で動く（定時実行は遅れたり抜けたりするため。取得済みのレースは取らない）。

on:
  schedule:
    - cron: "17 12 * * 6,0,1" # 土・日・月 21:17 JST（その日の全レース）
    - cron: "47 12 * * 6,0,1" # 21:47 JST（予備）
    - cron: "37 22 * * 1"     # 火曜 7:37 JST（予備）
  workflow_dispatch:
    inputs:
      from:
        description: "収集開始日（YYYY-MM-DD、省略時は終了日の7日前）"
        required: false
      to:
        description: "収集終了日（YYYY-MM-DD、省略時は昨日）"
        required: false
      only:
        description: "絞り込み（空=全レース / shinba / graded）"
        required: false

concurrency:
  group: jra-archive-writer
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install beautifulsoup4 requests
      - name: Checkout private archive (kb-project jra-archive)
        uses: actions/checkout@v4
        with:
          repository: momokuomomo-crypto/kb-project
          ref: jra-archive
          path: archive
          token: ${{ secrets.ARCHIVE_TOKEN }}
          fetch-depth: 1
      - name: Git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
      - name: Collect
        working-directory: collector
        run: |
          args="--archive $GITHUB_WORKSPACE/archive --git-push --budget-min 300"
          if [ -n "${{ github.event.inputs.from }}" ]; then args="$args --from ${{ github.event.inputs.from }}"; fi
          if [ -n "${{ github.event.inputs.to }}" ]; then args="$args --to ${{ github.event.inputs.to }}"; fi
          case "${{ github.event.inputs.only }}" in
            shinba) args="$args --shinba-only" ;;
            graded) args="$args --graded-only" ;;
          esac
          python -m jra_archive.main collect $args
      - name: Fill missing grades
        working-directory: collector
        run: python -m jra_archive.main fix-grades --archive $GITHUB_WORKSPACE/archive --git-push
      - name: Pedigree (new horses)
        working-directory: collector
        run: python -m jra_archive.main pedigree --archive $GITHUB_WORKSPACE/archive --git-push --budget-min 90
